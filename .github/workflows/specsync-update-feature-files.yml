---
name: Reusable SpecSync Update Feature Files Workflow

on:
  workflow_call:
    inputs:
      workflow_runner:
        description: Workflow Runner Details
        type: string
        required: false
        default: '["ubuntu-latest"]'

      test_directory:
        description: Directory containing test specifications
        type: string
        required: true

      dotnet_version:
        description: .NET version to use
        type: string
        required: false
        default: "8.0.x"

      commit_message:
        description: Commit message for the changes
        type: string
        required: false
        default: "chore: Update feature files with test case IDs via SpecSync [skip ci]"

      project_url:
        description: Azure DevOps project URL
        type: string
        required: true

      local_tags:
        description: Local tags filter for test synchronization
        type: string
        required: false
        default: "(@manual or @automated) and @system_requirement_* and @brite_*"

      test_case_tag_prefix:
        description: Test case tag prefix
        type: string
        required: false
        default: "TestCaseId"

      specsync_azuredevops_version:
        description: SpecSync Azure DevOps Tool Version
        type: string
        required: false
        default: "3.4.32"

      mock:
        description: >
          Run without contacting Azure DevOps. Skips the license file, the
          SpecSync tool install and both push calls; instead injects synthetic
          test case ID tags so the commit-back and PR-comment paths can be
          exercised without a SpecSync license or ADO PAT.
        type: boolean
        required: false
        default: false

    secrets:
      SPECSYNC_PERSONAL_ACCESS_TOKEN:
        description: SpecSync Personal Access Token (not needed when mock is true)
        required: false
      SPECSYNC_LICENSE_KEY:
        description: SpecSync License Key (not needed when mock is true)
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  update-feature-files:
    name: Update Feature Files with Test Case IDs
    runs-on: ${{ fromJSON(inputs.workflow_runner) }}
    steps:
      - name: Log Workflow Input
        run: |
          echo "Test Directory: ${{ inputs.test_directory }}"
          echo "Project URL:    ${{ inputs.project_url }}"
          echo "Local Tags:     ${{ inputs.local_tags }}"
          echo "Prefix:         ${{ inputs.test_case_tag_prefix }}"
          echo "Mock mode:      ${{ inputs.mock }}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up .NET Core
        if: ${{ !inputs.mock }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Create SpecSync configuration
        run: |
          cat > ${{ inputs.test_directory }}/specsync_create_tests.json << 'EOF'
          {
            "$schema": "https://schemas.specsolutions.eu/specsync4azuredevops-config-latest.json",
            "compatibilityVersion": "${{ inputs.specsync_azuredevops_version }}",
            "remote": { "projectUrl": "${{ inputs.project_url }}" },
            "local":  { "tags": "${{ inputs.local_tags }}" },
            "synchronization": {
              "testCaseTagPrefix": "${{ inputs.test_case_tag_prefix }}",
              "tagPrefixSeparators": ["_"],
              "format": {
                "useExpectedResult": true,
                "emptyActionValue": "N/A",
                "emptyExpectedResultValue": "N/A",
                "prefixTitle": false
              }
            }
          }
          EOF

      - name: Setup SpecSync as local tool
        if: ${{ !inputs.mock }}
        run: |
          dotnet new tool-manifest
          dotnet tool install SpecSync.AzureDevOps --version "${{ inputs.specsync_azuredevops_version }}"
          dotnet tool restore
          dotnet specsync version

      - name: Configure Git
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name  "GitHub Action"

      - name: SpecSync Dry Run Validation
        id: specsync_dryrun
        env:
          SPECSYNC_PERSONAL_ACCESS_TOKEN: ${{ secrets.SPECSYNC_PERSONAL_ACCESS_TOKEN }}
        run: |
          cd "${{ inputs.test_directory }}"

          if [ "${{ inputs.mock }}" = "true" ]; then
            echo "MOCK MODE: skipping Azure DevOps dry run."
            echo "Generated config that would have been used:"
            cat specsync_create_tests.json
            echo ""
            echo "Feature files discovered:"
            find . -name '*.feature' -print
            echo "dryrun_success=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          dotnet specsync push specsync_create_tests.json --user $SPECSYNC_PERSONAL_ACCESS_TOKEN --zeroExitCodeForWarnings --dryRun
          RC=$?
          set -e
          if [ $RC -eq 0 ]; then
            echo "dryrun_success=true"  >> "$GITHUB_OUTPUT"
          else
            echo "dryrun_success=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Execute SpecSync push
        id: specsync_execution
        if: steps.specsync_dryrun.outputs.dryrun_success == 'true'
        env:
          TEST_DIRECTORY: ${{ inputs.test_directory }}
          TAG_PREFIX: ${{ inputs.test_case_tag_prefix }}
          SPECSYNC_PERSONAL_ACCESS_TOKEN: ${{ secrets.SPECSYNC_PERSONAL_ACCESS_TOKEN }}
        run: |
          if [ "${{ inputs.mock }}" = "true" ]; then
            echo "MOCK MODE: injecting synthetic @${TAG_PREFIX}_* tags instead of pushing to ADO."
            python3 - <<'PY'
          import os, pathlib, re

          root   = pathlib.Path(os.environ["TEST_DIRECTORY"])
          prefix = os.environ["TAG_PREFIX"]
          scenario_re = re.compile(r"^\s*(Scenario|Scenario Outline|Example):")
          next_id = 9001

          for path in sorted(root.rglob("*.feature")):
              lines = path.read_text(encoding="utf-8").splitlines()
              out, changed = [], False

              for line in lines:
                  if not scenario_re.match(line):
                      out.append(line)
                      continue

                  # Collect the contiguous tag block already emitted above this scenario.
                  start = len(out)
                  while start > 0 and out[start - 1].strip().startswith("@"):
                      start -= 1
                  tag_block = out[start:]

                  if any(f"@{prefix}_" in t for t in tag_block):
                      out.append(line)
                      continue

                  tag = f"@{prefix}_{next_id}"
                  next_id += 1
                  if tag_block:
                      out[-1] = f"{out[-1]} {tag}"
                  else:
                      indent = line[: len(line) - len(line.lstrip())]
                      out.append(f"{indent}{tag}")
                  out.append(line)
                  changed = True

              if changed:
                  path.write_text("\n".join(out) + "\n", encoding="utf-8")
                  print(f"tagged: {path}")
              else:
                  print(f"unchanged (already tagged): {path}")
          PY
            echo "specsync_success=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cd "${{ inputs.test_directory }}"
          set +e
          dotnet specsync push specsync_create_tests.json --user $SPECSYNC_PERSONAL_ACCESS_TOKEN --zeroExitCodeForWarnings
          RC=$?
          set -e
          if [ $RC -eq 0 ]; then
            echo "specsync_success=true"  >> "$GITHUB_OUTPUT"
          else
            echo "specsync_success=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for changes and commit
        id: changes_found
        if: always() && steps.specsync_dryrun.outputs.dryrun_success == 'true'
        run: |
          git add "**/*.feature"
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            BRANCH=$(git rev-parse --abbrev-ref HEAD)
            if [ "$BRANCH" = "HEAD" ]; then
              git checkout ${{ github.head_ref }}
              BRANCH=${{ github.head_ref }}
            fi
            git commit -m "${{ inputs.commit_message }}"
            git push origin "$BRANCH"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on PR (success)
        if: always() && steps.changes_found.outputs.has_changes == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const body = `## SpecSync Feature File Update\n\nFeature files were updated with @${{ inputs.test_case_tag_prefix }} tags.\n\n- Project: ${{ inputs.project_url }}\n- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Comment on PR (failure)
        if: (steps.specsync_dryrun.outputs.dryrun_success == 'false' || steps.specsync_execution.outputs.specsync_success == 'false') && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const body = `## SpecSync Failed\n\nCheck the workflow logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail job on error
        if: steps.specsync_dryrun.outputs.dryrun_success == 'false' || steps.specsync_execution.outputs.specsync_success == 'false'
        run: exit 1
