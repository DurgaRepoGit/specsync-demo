---
name: Update Feature Files (Caller)

on:
  pull_request:
    branches: [main]
    paths:
      - "tests/**/*.feature"
  workflow_dispatch:

jobs:
  specsync:
    uses: ./.github/workflows/specsync-update-feature-files.yml
    with:
      test_directory: tests
      project_url: https://dev.azure.com/ADSP-Org-A03/CII-Surveillance
    secrets:
      SPECSYNC_PERSONAL_ACCESS_TOKEN: ${{ secrets.SPECSYNC_PERSONAL_ACCESS_TOKEN }}
      SPECSYNC_LICENSE_KEY: ${{ secrets.SPECSYNC_LICENSE_KEY }}
